# Maestro demo stack — INFRASTRUCTURE AND OBSERVABILITY ONLY.
#
# The four JVMs (loan-application, verification-gateway, underwriting, and
# maestro-admin) deliberately run on the HOST from built boot jars, started by
# demo/scripts/start-services.sh. None of them has a Dockerfile, and a demo
# that kills a workflow owner wants `kill -9 <pid>` on a real host process —
# not `docker kill`, which conflates "the process died" with "the container
# runtime restarted it".
#
# Usage:
#   docker compose -f demo/docker-compose.yml up -d      # infra + observability
#   demo/scripts/start-services.sh                       # the four host JVMs
#   demo/scripts/stop-services.sh                        # stop the host JVMs
#   docker compose -f demo/docker-compose.yml down -v    # tear everything down
#
# Endpoints:
#   Grafana      http://localhost:3000   (anonymous, dashboard auto-provisioned)
#   Prometheus   http://localhost:9090
#   Jaeger UI    http://localhost:16686
#   maestro-admin http://localhost:8080  (host JVM)
#   loan services http://localhost:8091-8093 (host JVMs; 8094 with TWO_NODE=1)
#
# Infrastructure host ports (5433 / 6380 / 29093) are deliberately IDENTICAL to
# maestro-samples/sample-loan-origination/docker-compose.yml, so the loan
# services' application.yml defaults apply unchanged. The consequence is that
# the two stacks cannot be up at the same time — the port bind fails loudly,
# which is the right failure. Distinct compose project name and volume keep
# their DATA separate.
#
# Every container gets an explicit mem_limit: the whole stack has to fit
# alongside four 256m-heap JVMs on a laptop (five under TWO_NODE=1).
#
# READ THESE AS CEILINGS, NOT RESERVATIONS. The seven limits sum to 3.38 GiB and
# five host JVMs peak around 340 MiB RSS each, so the theoretical worst case is
# ~5.1 GiB — above the ~4 GB budget the demo quotes. The budget holds because
# nothing approaches its ceiling: the measured true simultaneous peak across all
# 11 components is 2.42 GiB (demo/.evidence/task-6-peak-memory.log, 1213
# samples), with Kafka the largest single consumer at 627.6 MiB against its 1g
# limit. "Every container is capped" is not the same claim as "the stack fits
# 4 GB"; the second one is true by measurement, not by these numbers.

name: maestro-demo

services:

  # ── Infrastructure ─────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: maestro
      POSTGRES_USER: maestro
      POSTGRES_PASSWORD: maestro
    ports:
      - "5433:5432"
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
      - ./docker/init-demo-dbs.sh:/docker-entrypoint-initdb.d/init-demo-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro -d maestro"]
      interval: 3s
      timeout: 3s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    mem_limit: 128m
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # NOTE: bind-all listeners use the empty-host form (://:port), NOT
      # 0.0.0.0 — the apache/kafka image's storage-format step rejects
      # 0.0.0.0 ("advertised.listeners cannot use the nonroutable
      # meta-address") even when KAFKA_ADVERTISED_LISTENERS is set.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Topics are pre-created by kafka-init — Maestro never auto-creates
      # topics, so unexpected topic names must fail loudly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: "maestro-demo-cluster-001"
    ports:
      - "29093:29093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 20s

  # Pre-creates every topic the demo uses. Maestro NEVER auto-creates topics.
  kafka-init:
    image: apache/kafka:3.9.0
    mem_limit: 512m
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Creating Kafka topics..."
        KAFKA="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092"
        # Engine task-dispatch topics (one per service)
        $$KAFKA --create --if-not-exists --topic maestro.tasks.loan-application      --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic maestro.tasks.verification-gateway  --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic maestro.tasks.underwriting          --partitions 3 --replication-factor 1
        # Engine inbound signal channels (one per service). maestro-admin also
        # publishes its retry/terminate commands onto these (signal-topic-prefix).
        $$KAFKA --create --if-not-exists --topic maestro.signals.loan-application     --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic maestro.signals.verification-gateway --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic maestro.signals.underwriting         --partitions 3 --replication-factor 1
        # Engine lifecycle events. UNLIKE the loan sample (which runs no admin
        # and sets maestro.admin.events.enabled=false), this demo runs
        # maestro-admin and start-services.sh turns lifecycle publishing ON, so
        # this topic carries real traffic and maestro-admin consumes it.
        $$KAFKA --create --if-not-exists --topic maestro.admin.events           --partitions 3 --replication-factor 1
        # Cross-service business event topics (keyed by loanId). These are the
        # hops that carry the W3C `traceparent` header, which is what makes a
        # single Jaeger trace span all three services.
        $$KAFKA --create --if-not-exists --topic loans.verification.requests    --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic loans.verification.results     --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic loans.underwriting.requests    --partitions 3 --replication-factor 1
        $$KAFKA --create --if-not-exists --topic loans.underwriting.decisions   --partitions 3 --replication-factor 1
        echo "All Kafka topics created successfully."

  # ── Observability ──────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.6.0
    mem_limit: 512m
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # File-SD directory for the optional TWO_NODE=1 second loan-application
      # instance. Empty in the default single-node demo — see prometheus.yml.
      - ./targets:/etc/prometheus/targets:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 2h retention: a demo, not a monitoring system.
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    # `host.docker.internal` is native on Docker Desktop; this makes the same
    # compose file work on plain Docker Engine / Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:12.2.0
    mem_limit: 512m
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Anonymous access: nobody logs into Grafana during a live demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      # Land straight on the Maestro dashboard (uid pinned in maestro.json).
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/maestro.json
      GF_FEATURE_TOGGLES_ENABLE: ""
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

  # Jaeger v2 all-in-one. Unlike the v1 `all-in-one` image, v2 is an
  # OpenTelemetry-Collector distribution: the OTLP receivers (4317 gRPC / 4318
  # HTTP) are enabled by its default configuration, so no COLLECTOR_OTLP_ENABLED
  # flag is needed. Storage is in-memory — a demo wants a clean slate on
  # restart, and nothing here is worth persisting.
  #
  # The three loan services export to http://localhost:4318/v1/traces via
  # OTEL_EXPORTER_OTLP_ENDPOINT, bound in application.yml to Spring Boot 4's
  # `management.opentelemetry.tracing.export.otlp.endpoint` (the Boot 3.x name
  # `management.otlp.tracing.endpoint` is silently inert on Boot 4 — see
  # task-1-report.md §3).
  jaeger:
    image: jaegertracing/jaeger:2.11.0
    mem_limit: 768m
    ports:
      - "16686:16686"   # Jaeger UI + /api/traces query API
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP  ← the services export here
    environment:
      # Bound the in-memory span store so a long demo cannot grow unbounded.
      JAEGER_MEMORY_MAX_TRACES: "50000"

volumes:
  demo-pgdata:
