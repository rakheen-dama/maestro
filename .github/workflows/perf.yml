name: Perf (k6)

# The k6 load harness (perf/run.sh, docs/test-plan.md § Load suite) on a
# GitHub-hosted runner. The LOAD job never runs on pull requests or pushes: a
# load run takes
# 10-40 minutes, and its numbers come from a shared 4-vCPU runner whose
# neighbours vary from run to run, so a latency or throughput figure measured
# here is not a merge signal (D4: the harness gates only statement counts and
# correctness; the rest is reported). It runs on demand and once a week, to
# keep a standing record against the committed baselines (perf/baselines/).
#
# Pull requests that touch perf/**, sample-perf or this file run only the
# `selftest` job: the harness's no-Docker self-tests on committed files
# (evidence privacy guard, evaluator self-test rebuilt from
# perf/.evidence/wp11/, the baseline-record self-test), a few minutes, with
# contents: read. The run-lock race test (perf/lib/lock-selftest.sh) is not
# in it: it is timing-based and meant for a local shell.
#
# Profile: the schedule and the dispatch default run `local`, the profile both
# committed baselines were recorded with, so the baseline gates judge
# (gate.statementsPerWorkflow, gate.parkedCostBaseline). `full` is a manual
# choice: no baseline is recorded for it, so its baseline gates read
# NO_BASELINE (reported below) and only the absolute gates judge.
#
# Hardware-sensitive on a shared runner (the statement figures are not: they
# did not move with host load in any committed run):
#   - dropped iterations: k6's VUs exhausted, by a slow system under test or
#     a starved generator (validity.droppedIterations -> INVALID);
#   - the plan's iteration count: k6 must start the stage table's
#     iterations within max(2, 0.5 %) (validity.plan -> INVALID); the
#     warm-up must drain before the idle window (validity.warmup -> INVALID);
#   - Scenario 3's plateau wait: each plateau must park within 600 s
#     (correctness.plateauReached -> FAIL);
#   - drain timeouts: S1 300 s (local) / 1200 s (full), S3 probes 120 s, the
#     S3 release 120 s + Pmax / 10 s (correctness.* -> FAIL).
# So read a FAIL's detail before calling it an engine regression.
#
# The schedule is subject to GitHub's 60-day inactivity disable. build-test.yml's
# `keep-nightly-enabled` job re-enables it on every push to main; manual
# recovery is `gh workflow enable perf.yml`.
#
# Verdicts: perf/run.sh exits 0 PASS, 1 FAIL, 2 INVALID, 3 harness error.
# FAIL and ERROR fail the job on every trigger. INVALID (the measurement could
# not be trusted, typically the runner, see above) fails a dispatched job, but
# on the schedule it is a warning annotation and the job succeeds: a weekly
# run on a noisy neighbour must not read as a red build. A gate that had no
# usable baseline (status NO_BASELINE; the verdict can still be PASS) is
# reported as a warning annotation and in the step summary, never silently
# counted as passed. Admin events default to false, the engine's default and the setting
# the committed baselines were recorded with.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario to run
        type: choice
        options: [smoke, s1-throughput, s3-parked]
        default: s1-throughput
      profile:
        description: Load profile
        type: choice
        options: [local, full]
        default: local
      replicas:
        description: Node replicas (a positive integer)
        type: string
        default: '1'
      admin_events:
        description: maestro.admin.events.enabled on the nodes
        type: choice
        options: ['true', 'false']
        default: 'false'
  pull_request:
    paths:
      - 'perf/**'
      - 'maestro-samples/sample-perf/**'
      - '.github/workflows/perf.yml'
  schedule:
    # 04:00 UTC Saturday: clear of the 02:30 nightly E2E and the Sunday 01:00
    # soak (e2e-nightly.yml).
    - cron: '0 4 * * 6'

permissions:
  contents: read

# Load runs share one group and never cancel each other; a pull request's
# self-tests have their own group per ref and supersede an older push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('perf-selftest-{0}', github.ref) || 'perf' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    name: perf self-tests (no Docker)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # jq is preinstalled on ubuntu-latest (jq 1.7.1; the evaluator
      # self-test passes on 1.7.1 and 1.8.1).
      - name: Evidence carries no path or host name
        run: perf/lib/evidence-selftest.sh

      - name: Evaluator self-test (from committed evidence)
        run: perf/eval/selftest-evidence.sh

      - name: Baseline-record self-test
        run: perf/lib/baseline-selftest.sh

  perf:
    name: k6 ${{ matrix.scenario }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ github.event_name == 'schedule' && fromJSON('["s1-throughput","s3-parked"]') || fromJSON(format('["{0}"]', inputs.scenario)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The run's identity stamp reads the last commit touching the engine
          # and harness paths (git log -- <paths>): it needs the history.
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the scenario
        # Inputs reach the shell as environment variables, never spliced into
        # the script text.
        env:
          PERF_SCENARIO: ${{ matrix.scenario }}
          PERF_PROFILE: ${{ inputs.profile || 'local' }}
          PERF_REPLICAS: ${{ inputs.replicas || '1' }}
          PERF_ADMIN_EVENTS: ${{ inputs.admin_events || 'false' }}
        # jq (which run.sh needs) is preinstalled on ubuntu-latest (the
        # runner image's tool list, actions/runner-images Ubuntu2404-Readme).
        # Exit 2 (INVALID) on the schedule is a warning, not a failed job;
        # every other non-zero exit fails it (header: Verdicts).
        run: |
          rc=0
          perf/run.sh "$PERF_SCENARIO" --profile "$PERF_PROFILE" --replicas "$PERF_REPLICAS" || rc=$?
          if [[ "$rc" == 2 && "$GITHUB_EVENT_NAME" == schedule ]]; then
            echo "::warning title=Perf INVALID (${PERF_SCENARIO})::the measurement could not be trusted (see the validity checks in the step summary); a scheduled INVALID does not fail the job"
            exit 0
          fi
          exit "$rc"

      - name: Summarise
        if: always()
        run: |
          shopt -s nullglob
          for s in perf/results/*/summary.md; do cat "$s" >> "$GITHUB_STEP_SUMMARY"; done
          for r in perf/results/*/result.json; do
            verdict=$(jq -r '.verdict // "none"' "$r")
            echo "::notice title=Perf verdict::${verdict} (${r%/result.json})"
            # One line per check; % CR LF escaped as workflow commands require.
            jq -r '.checks[] | select(.status == "NO_BASELINE")
                   | "\(.id)\t\(.detail // "" | tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A"))"' "$r" |
              while IFS=$'\t' read -r id detail; do
                echo "::warning title=NO_BASELINE ${id}::${detail}"
                printf -- "- **NO_BASELINE** \`%s\`: %s\n" "$id" "$detail" >> "$GITHUB_STEP_SUMMARY"
              done
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.scenario }}-${{ github.run_id }}
          path: perf/results/
          retention-days: 14
