name: Consumer smoke

# The consumer smoke test (maestro-integration-tests/consumer-smoke, a
# standalone build outside settings.gradle.kts) against a release already
# PUBLISHED to GitHub Packages: a service that consumes it exactly as a user
# does — the BOM and the starter from the registry, the Spring Boot platform
# imported by itself — runs one workflow to completion on Testcontainers
# Postgres + Kafka. A pull request cannot change what this tests, so it runs
# weekly and on demand, not per PR. The artifacts being released are
# smoke-tested by the release gate instead (release.yml,
# publish-github-packages.yml; RELEASING.md, "The release gate").
#
# The version defaults to the newest row of previousReleases in
# maestro-integration-tests/rolling-node/build.gradle.kts
# (scripts/previous-release.sh).
#
# GitHub disables a scheduled workflow after 60 days without a commit;
# build-test.yml's keep-nightly-enabled job re-enables it on a push,
# and the on-demand trigger always works.

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Maestro version to consume (empty = the newest previousReleases row)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  consumer-smoke:
    name: Consumer smoke (a published release from GitHub Packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Choose the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          scripts/previous-release.sh > "$RUNNER_TEMP/previous.txt"
          cat "$RUNNER_TEMP/previous.txt" >> "$GITHUB_OUTPUT"
          if [[ -n "$REQUESTED" ]]; then
            if [[ ! "$REQUESTED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error title=Consumer smoke::'$REQUESTED' is not a version"
              exit 1
            fi
            echo "maestro-version=$REQUESTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run one workflow on the published release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAESTRO_VERSION: ${{ steps.version.outputs.maestro-version }}
          SPRING_BOOT_VERSION: ${{ steps.version.outputs.spring-boot-version }}
        run: >-
          ./gradlew -p maestro-integration-tests/consumer-smoke test
          "-Pmaestro.version=$MAESTRO_VERSION" "-Pmaestro.springBootVersion=$SPRING_BOOT_VERSION"

      - name: Upload consumer-smoke reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: consumer-smoke-reports
          path: maestro-integration-tests/consumer-smoke/build/reports/tests/
          retention-days: 14
