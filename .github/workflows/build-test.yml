name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # The two-build rolling test (maestro-integration-tests, RollingUpgradeIT):
  # a node of each previous release runs beside a node of this build on one
  # database, and runs parked by either are adopted and woken by the other. It
  # resolves the previous releases from this repository's GitHub Packages
  # registry, which asks for a token on every download, so it is a job of its
  # own with `packages: read` and is not part of `./gradlew build`.
  #
  # A pull request from a fork, and a Dependabot run, may get a token that
  # cannot read the registry. Rather than fail at dependency resolution, the
  # job skips the test there and says so in a notice; the skipped job reports
  # success, which says nothing about rolling upgrades. Before making it a
  # required check, see RELEASING.md, "The rolling test against previous
  # releases".
  rolling-upgrade:
    name: Rolling upgrade (previous release beside this build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read

    steps:
      - name: Decide whether this run can read GitHub Packages
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          reason=""
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPOSITORY" ]]; then
            reason="a pull request from a fork"
          elif [[ "$ACTOR" == "dependabot[bot]" ]]; then
            reason="a Dependabot run"
          fi
          if [[ -n "$reason" ]]; then
            echo "::notice title=Rolling upgrade skipped::${reason} may not read the GitHub Packages registry the previous releases come from; the rolling test did not run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Java 25
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Run the two-build rolling test
        if: steps.gate.outputs.run == 'true'
        env:
          # Read by rolling-node/build.gradle.kts with GITHUB_ACTOR, which
          # Actions sets; never echoed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :maestro-integration-tests:rollingUpgradeTest

      # results.txt holds one line per scenario (PASSED, FAILED or ABORTED, and
      # what it observed). A rollback stand-down passes the test, since the
      # previous release may stand down rather than finish (docs/operations.md
      # §10.3), so it is surfaced here as a warning on the run instead.
      - name: Summarise the rolling-upgrade results
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          results=maestro-integration-tests/build/rolling-upgrade/results.txt
          if [[ ! -f "$results" ]]; then
            echo "::warning title=Rolling upgrade::no results.txt: the rolling test did not get as far as a scenario"
            exit 0
          fi
          {
            echo "### Rolling upgrade"
            echo
            echo '```'
            cat "$results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # % CR LF escaped as workflow commands require.
          grep -F 'STOOD DOWN' "$results" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' |
            while IFS= read -r line; do
              echo "::warning title=Rollback stand-down::${line}"
            done || true

      # Uploaded unconditionally: each node's log and results.txt are the
      # evidence.
      - name: Upload rolling-upgrade logs
        uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: rolling-upgrade-logs
          path: |
            maestro-integration-tests/build/rolling-upgrade/
            maestro-integration-tests/build/reports/tests/rollingUpgradeTest/
          retention-days: 14

  # The consumer smoke test (maestro-integration-tests/consumer-smoke, a
  # standalone build outside this repository's settings.gradle.kts): a service
  # that consumes the previous release exactly as a user does — the BOM and the
  # starter from GitHub Packages, the Spring Boot platform imported by itself —
  # runs one workflow to completion on Testcontainers Postgres + Kafka. The
  # previous release is the newest row of previousReleases in
  # maestro-integration-tests/rolling-node/build.gradle.kts. Same fork and
  # Dependabot gate, and the same permissions, as the rolling-upgrade job.
  consumer-smoke:
    name: Consumer smoke (previous release from GitHub Packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Decide whether this run can read GitHub Packages
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          reason=""
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPOSITORY" ]]; then
            reason="a pull request from a fork"
          elif [[ "$ACTOR" == "dependabot[bot]" ]]; then
            reason="a Dependabot run"
          fi
          if [[ -n "$reason" ]]; then
            echo "::notice title=Consumer smoke skipped::${reason} may not read the GitHub Packages registry the previous release comes from; the consumer smoke test did not run"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Find the previous release
        if: steps.gate.outputs.run == 'true'
        id: previous
        run: scripts/previous-release.sh >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Run one workflow on the published previous release
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAESTRO_VERSION: ${{ steps.previous.outputs.maestro-version }}
          SPRING_BOOT_VERSION: ${{ steps.previous.outputs.spring-boot-version }}
        run: >-
          ./gradlew -p maestro-integration-tests/consumer-smoke test
          "-Pmaestro.version=$MAESTRO_VERSION" "-Pmaestro.springBootVersion=$SPRING_BOOT_VERSION"

      - name: Upload consumer-smoke reports
        uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: consumer-smoke-reports
          path: maestro-integration-tests/consumer-smoke/build/reports/tests/
          retention-days: 14

  # The API compatibility report: japicmp compares the public API of every
  # published module of this build with the previous release's jars from
  # GitHub Packages (maestro-integration-tests/api-compat, a standalone build).
  # Until 1.0 it REPORTS — the job summary and an artifact — and never fails on
  # a change; RELEASING.md, "API compatibility report", says how to make it
  # fail. The internal-until-1.0 packages (core.spi, core.loop, core.engine)
  # are reported in a section of their own. Same gate as the jobs above.
  api-compat:
    name: API compatibility report (against the previous release)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Decide whether this run can read GitHub Packages
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          reason=""
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REPO" != "$REPOSITORY" ]]; then
            reason="a pull request from a fork"
          elif [[ "$ACTOR" == "dependabot[bot]" ]]; then
            reason="a Dependabot run"
          fi
          if [[ -n "$reason" ]]; then
            echo "::notice title=API compatibility report skipped::${reason} may not read the GitHub Packages registry the previous release comes from; no report was made"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Find the previous release
        if: steps.gate.outputs.run == 'true'
        id: previous
        run: scripts/previous-release.sh >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        if: steps.gate.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@v5

      - name: Publish this build's jars to a local repository
        if: steps.gate.outputs.run == 'true'
        run: >-
          ./gradlew publishToMavenLocal -Pversion=0.0.0-api-check
          "-Dmaven.repo.local=$RUNNER_TEMP/api-check-repo"

      - name: Compare with the previous release
        if: steps.gate.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAESTRO_VERSION: ${{ steps.previous.outputs.maestro-version }}
          SPRING_BOOT_VERSION: ${{ steps.previous.outputs.spring-boot-version }}
        run: >-
          ./gradlew -p maestro-integration-tests/api-compat apiCompatReport
          "-Pmaestro.oldVersion=$MAESTRO_VERSION" -Pmaestro.newVersion=0.0.0-api-check
          "-Pmaestro.newRepo=$RUNNER_TEMP/api-check-repo" "-Pmaestro.springBootVersion=$SPRING_BOOT_VERSION"

      - name: Write the report to the job summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          summary=maestro-integration-tests/api-compat/build/reports/api-compat/summary.md
          if [[ -f "$summary" ]]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=API compatibility report::no summary.md: the comparison did not complete"
          fi

      - name: Upload the API compatibility report
        uses: actions/upload-artifact@v7
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: api-compat-report
          path: maestro-integration-tests/api-compat/build/reports/api-compat/
          retention-days: 14

  # GitHub disables every scheduled workflow after 60 days without a commit
  # (that is what took E2E (loan-origination) offline from 2026-10-10 until
  # this cycle). A scheduled keepalive would be disabled with it; a push is
  # the only event that proves the repository is alive, so the first push
  # after a dormant period turns the scheduled workflows back on: the nightly
  # E2E (e2e-nightly.yml) and the weekly k6 load job (perf.yml).
  keep-nightly-enabled:
    name: Re-enable the nightly E2E schedule
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Enable E2E (loan-origination) if GitHub disabled it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable e2e-nightly.yml

      - name: Enable Perf (k6) if GitHub disabled it
        # Independent of the step above: a failure to re-enable one schedule
        # must not leave the other disabled.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable perf.yml
