name: Release to Maven Central

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-java writes ~/.m2/settings.xml with the `central` server credentials
      # and imports the GPG key — the Maven equivalent of the Gradle plugin's
      # ORG_GRADLE_PROJECT_* property injection.
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # -Drevision overrides the version from the tag (was: -Pversion=X.Y.Z).
      # `deploy -Prelease` builds, tests, attaches sources/javadoc, signs, and
      # uploads to the Central Portal in one pass.
      - name: Build, test, and publish to Maven Central
        run: mvn -B -Drevision="$REVISION" deploy -Prelease
        env:
          REVISION: ${{ steps.version.outputs.VERSION }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: gh release create "$TAG" --title "Maestro $VERSION" --generate-notes
