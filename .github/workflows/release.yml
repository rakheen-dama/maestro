name: Release to Maven Central

on:
  push:
    # Final releases only. A pre-release tag (v0.3.0-rc.1) carries a hyphen
    # and is published by publish-github-packages.yml instead.
    tags: ['v*.*.*', '!v*.*.*-*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release gate (RELEASING.md, "The release gate"), a job of its own with a
  # read-only token, before anything is published.
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # The rolling test resolves the previous release from GitHub Packages.
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: "Release gate: the previous release is the newest row and has its upgrade fixtures"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          # Set only for the very first release (RELEASING.md, "The release gate").
          MAESTRO_FIRST_RELEASE: ${{ vars.MAESTRO_FIRST_RELEASE }}
          # Lists the published GitHub releases: a tag counts as released only
          # once its release exists (the publishing job's last step).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/previous-release.sh --check-release "$VERSION"

      - name: "Release gate: the rolling test against the previous release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :maestro-integration-tests:rollingUpgradeTest

      - name: "Release gate: this build's artifacts run the consumer smoke test"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ./gradlew publishToMavenLocal "-Pversion=$VERSION" "-Dmaven.repo.local=$RUNNER_TEMP/release-repo"
          ./gradlew -p maestro-integration-tests/consumer-smoke test "-Pmaestro.version=$VERSION" \
            "-Pmaestro.repo=$RUNNER_TEMP/release-repo"

      - name: Upload release-gate reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-gate-reports
          path: |
            maestro-integration-tests/build/rolling-upgrade/
            maestro-integration-tests/build/reports/tests/rollingUpgradeTest/
            maestro-integration-tests/consumer-smoke/build/reports/tests/
          retention-days: 14

  release:
    name: Publish & Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: maven-central
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./gradlew build "-Pversion=$VERSION"

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository "-Pversion=$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: gh release create "$TAG" --title "Maestro $VERSION" --generate-notes
