name: Release to Maven Central

on:
  push:
    # Final releases only. A pre-release tag (v0.3.0-rc.1) carries a hyphen
    # and is published by publish-github-packages.yml instead.
    tags: ['v*.*.*', '!v*.*.*-*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # The release gate's rolling test resolves the previous release from GitHub Packages.
  packages: read

jobs:
  release:
    name: Publish & Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The release gate (RELEASING.md, "The release gate"), before anything is published.
      - name: "Release gate: the previous release has its upgrade fixtures"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: scripts/previous-release.sh --check-release "$VERSION"

      - name: "Release gate: the rolling test against the previous release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :maestro-integration-tests:rollingUpgradeTest

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./gradlew build "-Pversion=$VERSION"

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository "-Pversion=$VERSION"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: gh release create "$TAG" --title "Maestro $VERSION" --generate-notes
