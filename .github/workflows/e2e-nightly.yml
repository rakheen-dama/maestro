name: E2E (loan-origination)

# The loan-origination end-to-end run boots three Spring Boot services against
# Postgres, Valkey and Kafka, and includes a kill -9 recovery scenario. It is
# far too slow for the PR loop, so it runs nightly and on demand instead.
#
# The PR loop keeps the fast integration suites: `./gradlew build` runs
# maestro-integration-tests, which excludes @Tag("e2e").

on:
  schedule:
    # 02:30 UTC nightly.
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Lock-backend CI shape (Task 5 decision): the default full run below already
  # covers the multi-node scenario set (7-10) on the DEFAULT lock backend -
  # run-e2e.sh with no env runs scenarios 1-10 on Valkey - so the Valkey side
  # needs no extra job. The postgres side runs as a SECOND, parallel job
  # scoped to just the multi-node set (E2E_LOCK_BACKEND=postgres
  # E2E_ONLY="7 8 9 10"): those are the only scenarios whose semantics ride on
  # lock TTL/adoption behaviour, so re-running 1-6 on postgres would roughly
  # double runtime for no additional lock-backend signal. Both jobs run on
  # separate runners concurrently, so nightly wall-clock stays at the slower
  # of the two (the full Valkey suite) instead of their sum. Every service
  # start in BOTH jobs runtime-verifies the effective DistributedLock
  # implementation from the service's own boot log (assert_lock_backend) -
  # a postgres job silently running Valkey locks fails at service start.
  e2e:
    name: Loan-origination E2E (valkey, full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run the E2E scenarios
        run: ./e2e/run-e2e.sh
        working-directory: maestro-samples/sample-loan-origination

      # Uploaded unconditionally: the service logs and the run's pid files are
      # what make a failure diagnosable, and the run asserts process identity
      # against those pids.
      - name: Upload E2E logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: maestro-samples/sample-loan-origination/e2e/logs/
          retention-days: 14

  e2e-postgres-lock:
    name: Loan-origination E2E (postgres lock, multi-node set)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run the multi-node scenarios on the postgres lock backend
        run: E2E_LOCK_BACKEND=postgres E2E_ONLY="7 8 9 10" ./e2e/run-e2e.sh
        working-directory: maestro-samples/sample-loan-origination

      - name: Upload E2E logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs-postgres-lock
          path: maestro-samples/sample-loan-origination/e2e/logs/
          retention-days: 14
