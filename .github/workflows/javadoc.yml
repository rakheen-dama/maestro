name: Javadoc

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  javadoc:
    name: Build & Deploy Javadoc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # was: ./gradlew aggregateJavadoc — javadoc:aggregate is built into the
      # plugin; modules with maven.javadoc.skip=true (admin, samples) are excluded.
      - name: Generate aggregate Javadoc
        run: mvn -B -DskipTests compile javadoc:aggregate

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/reports/apidocs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
