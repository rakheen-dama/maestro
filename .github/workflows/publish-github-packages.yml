name: Pre-release to GitHub Packages

# A pre-release tag (a version with a hyphen suffix, e.g. v0.3.0-rc.1) publishes
# every library module and the BOM to this repository's GitHub Packages Maven
# registry. Final tags (v0.3.0) go to Maven Central through release.yml.
#
# No secrets to configure: the job's GITHUB_TOKEN publishes. Artifacts are not
# signed. A published version cannot be overwritten: publish a new suffix.
#
# The release gate (RELEASING.md, "The release gate") runs before anything is
# published: the previous release must have its upgrade fixtures, and the
# rolling test against it must pass. An experimental release
# (X.Y.Z-exp.<topic>.<n>, RELEASING.md, "Experimental releases") goes through
# the same gate; its name is checked, and its GitHub pre-release says it must
# never run against a database that matters.

on:
  push:
    tags: ['v*.*.*-*']

concurrency:
  # One group per tag: a re-run of the same tag waits, another tag is never cancelled.
  group: publish-github-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check an experimental release's name
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [[ "$VERSION" == *-exp* && ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-exp\.[a-z0-9]+(-[a-z0-9]+)*\.[0-9]+$ ]]; then
            echo "::error title=Experimental release name::$VERSION is not X.Y.Z-exp.<topic>.<n> (RELEASING.md, Experimental releases)"
            exit 1
          fi

      - name: "Release gate: the previous release has its upgrade fixtures"
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: scripts/previous-release.sh --check-release "$VERSION"

      - name: "Release gate: the rolling test against the previous release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :maestro-integration-tests:rollingUpgradeTest

      - name: Build and test
        # The version reaches the shell as data (an environment variable), never as script text.
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: ./gradlew build "-Pversion=$VERSION"

      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository "-Pversion=$VERSION"

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [[ "$VERSION" == *-exp.* ]]; then
            gh release create "$TAG" --title "Maestro $VERSION (experimental)" --prerelease \
              --notes "Experimental release from a branch: it may change events, payloads or migrations that no released build reads. Never run it against a database that matters. It is deleted when its branch closes (RELEASING.md, Experimental releases)."
          else
            gh release create "$TAG" --title "Maestro $VERSION" --generate-notes --prerelease
          fi
