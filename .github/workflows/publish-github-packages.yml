name: Pre-release to GitHub Packages

# A pre-release tag (a version with a hyphen suffix, e.g. v0.3.0-rc.1) publishes
# every library module and the BOM to this repository's GitHub Packages Maven
# registry. Final tags (v0.3.0) go to Maven Central through release.yml.
#
# No secrets to configure: the job's GITHUB_TOKEN publishes. Artifacts are not
# signed. A published version cannot be overwritten: publish a new suffix.

on:
  push:
    tags: ['v*.*.*-*']

concurrency:
  group: publish-github-packages
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish pre-release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build -Pversion=${{ steps.version.outputs.VERSION }}

      - name: Publish to GitHub Packages
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -Pversion=${{ steps.version.outputs.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: gh release create "$TAG" --title "Maestro $VERSION" --generate-notes --prerelease
