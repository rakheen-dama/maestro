spring:
  application:
    name: sample-verification-gateway-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:verification_gateway}
    username: ${POSTGRES_USER:maestro}
    password: ${POSTGRES_PASSWORD:maestro}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

  data:
    redis:
      url: redis://${VALKEY_HOST:localhost}:${VALKEY_PORT:6380}

server:
  port: ${SERVER_PORT:8092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  # Spring Boot 4.0.5 moved the OTLP tracing property out of the Boot-3-era
  # `management.otlp.tracing.endpoint` into the modular autoconfigure
  # package's own prefix. Verified at runtime via /actuator/conditions:
  # the old key leaves OtlpTracingConfigurations.ConnectionDetails
  # unmatched (@ConditionalOnProperty on the NEW key), so no SpanExporter
  # bean is ever created and the OTLP exporter never even attempts a
  # connection - the failure is silent, not a connection-refused.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

maestro:
  service-name: verification-gateway

  observability:
    metrics:
      enabled: true
    tracing:
      enabled: true

  # Multi-instance responsiveness: how often a parked workflow re-reads the
  # store for a wake that happened on another node (a signal ingested
  # elsewhere, or this service's simulated-latency sleep() timers fired by a
  # remote timer-poller leader). The engine default (30s) is tuned for large
  # fleets; this sample's timers are 2-8s demo latencies, so a 5s recheck
  # keeps multi-instance runs near single-node timing at negligible load.
  signal:
    wake-recheck-interval: 5s

  store:
    type: postgres

  messaging:
    type: kafka
    topics:
      tasks: maestro.tasks.verification-gateway
      signals: maestro.signals.verification-gateway

  lock:
    type: valkey

  worker:
    task-queues:
      - name: verification-gateway
        concurrency: 5

  admin:
    events:
      # No admin dashboard in this sample — lifecycle events are not
      # published. Previously a no-op (the property bound but nothing read
      # it); now actually disables lifecycle publishing end to end.
      enabled: false
