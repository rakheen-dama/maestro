spring:
  application:
    name: sample-loan-application-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:loan_application}
    username: ${POSTGRES_USER:maestro}
    password: ${POSTGRES_PASSWORD:maestro}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

  data:
    redis:
      url: redis://${VALKEY_HOST:localhost}:${VALKEY_PORT:6380}

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  # Spring Boot 4.0.5 moved the OTLP tracing property out of the Boot-3-era
  # `management.otlp.tracing.endpoint` into the modular autoconfigure
  # package's own prefix. Verified at runtime via /actuator/conditions:
  # the old key leaves OtlpTracingConfigurations.ConnectionDetails
  # unmatched (@ConditionalOnProperty on the NEW key), so no SpanExporter
  # bean is ever created and the OTLP exporter never even attempts a
  # connection - the failure is silent, not a connection-refused.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

maestro:
  service-name: loan-application

  observability:
    metrics:
      enabled: true
    tracing:
      enabled: true

  # Workflow timeouts (SPEC defaults) — bound via LoanSampleProperties.
  sample:
    doc-timeout: PT10M
    sign-timeout: PT10M
    decision-timeout: PT10M
    gate-timeout: PT1S

  # Multi-instance responsiveness: how often a parked workflow re-reads the
  # store for a wake that happened on another node. Sample default (engine
  # default is 30s) — see verification-gateway-service/application.yml.
  signal:
    wake-recheck-interval: 5s

  store:
    type: postgres

  messaging:
    type: kafka
    topics:
      tasks: maestro.tasks.loan-application
      signals: maestro.signals.loan-application

  lock:
    type: valkey

  worker:
    task-queues:
      - name: loan-application
        concurrency: 5

  admin:
    events:
      # No admin dashboard in this sample — lifecycle events are not
      # published. Previously a no-op (the property bound but nothing read
      # it); now actually disables lifecycle publishing end to end.
      enabled: false
