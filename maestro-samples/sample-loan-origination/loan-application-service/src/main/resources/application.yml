spring:
  application:
    name: sample-loan-application-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:loan_application}
    username: ${POSTGRES_USER:maestro}
    password: ${POSTGRES_PASSWORD:maestro}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

  data:
    redis:
      url: redis://${VALKEY_HOST:localhost}:${VALKEY_PORT:6380}

server:
  port: ${SERVER_PORT:8091}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  #
  # NO OTLP ENDPOINT IS SET HERE, DELIBERATELY.
  #
  # The property is `management.opentelemetry.tracing.export.otlp.endpoint` on
  # Spring Boot 4.0.5 - the Boot-3-era `management.otlp.tracing.endpoint` is
  # read by nothing, and setting it leaves
  # OtlpTracingConfigurations.ConnectionDetails unmatched
  # (@ConditionalOnProperty on the NEW key), so no SpanExporter bean is created
  # and the exporter never even attempts a connection. That failure is silent,
  # which is why the name is written out here.
  #
  # But the correct key must stay UNSET in committed config. With a live
  # default the exporter bean is always created, and every environment that
  # runs no collector - starting with this sample's own e2e/run-e2e.sh, which
  # runs no Jaeger - gets `ERROR ... Failed to export spans ...
  # ConnectException: Connection refused` with a full okhttp stack trace on
  # every run. run-e2e.sh:1204 sweeps the service logs for exactly that shape
  # and prints only the first 15 matching lines, so one export failure fills
  # the sweep and hides any real error behind it.
  #
  # Whoever wants OTLP supplies the endpoint: the demo does it from
  # demo/scripts/lib/jvm-env.sh (-D on the command line, alongside
  # maestro.recovery.poll-interval, for the same reason - the committed config
  # is what the e2e suite runs against and it should stay production-sane).

maestro:
  service-name: loan-application

  observability:
    metrics:
      enabled: true
    tracing:
      enabled: true

  # Workflow timeouts (SPEC defaults) — bound via LoanSampleProperties.
  sample:
    doc-timeout: PT10M
    sign-timeout: PT10M
    decision-timeout: PT10M
    gate-timeout: PT1S

  # Multi-instance responsiveness: how often a parked workflow re-reads the
  # store for a wake that happened on another node. Sample default (engine
  # default is 30s) — see verification-gateway-service/application.yml.
  signal:
    wake-recheck-interval: 5s

  store:
    type: postgres

  messaging:
    type: kafka
    topics:
      tasks: maestro.tasks.loan-application
      signals: maestro.signals.loan-application

  lock:
    type: valkey

  worker:
    task-queues:
      - name: loan-application
        concurrency: 5

  admin:
    events:
      # No admin dashboard in this sample — lifecycle events are not
      # published. Previously a no-op (the property bound but nothing read
      # it); now actually disables lifecycle publishing end to end.
      enabled: false
